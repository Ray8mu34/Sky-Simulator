# Independent static application; never merge this into another project's vhost.
server {
    listen 80;
    server_name sky.zjuaaa.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/data/sky-simulator/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://sky.zjuaaa.cn$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name sky.zjuaaa.cn;
    root /srv/apps/sky-simulator/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/sky.zjuaaa.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sky.zjuaaa.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/sky-simulator-access.log;
    error_log /var/log/nginx/sky-simulator-error.log;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Versioned asset names may be cached; HTML/SW must remain revalidatable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
